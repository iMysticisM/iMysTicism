<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#141A23" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="35%" stop-color="#8957E5" />
      <stop offset="70%" stop-color="#D2A8FF" />
      <stop offset="100%" stop-color="#3FB950" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#BC8CFF" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#58A6FF" fill-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Roboto, sans-serif;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: 2px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 1px;
      fill: #C9D1D9;
    }
    .tag {
      font-family: "JetBrains Mono", monospace, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1.5px;
      fill: #3FB950;
    }
    .accent-tag {
      font-family: "JetBrains Mono", monospace, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
      fill: #8957E5;
    }
  </style>

  <!-- Base Card with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#bg-grad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Cyber Grid Layer -->
  <rect x="2" y="2" width="1196" height="236" rx="16" fill="url(#cyber-grid)" />

  <!-- Top Status Indicator -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="0" r="4.5" fill="#3FB950" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="4" class="tag">SYSTEMS ONLINE &amp; PRODUCTION READY</text>
    <text x="360" y="4" class="accent-tag">[ CO-ARCHITECT — FAMWARETA ECOSYSTEM ]</text>
  </g>

  <!-- Main Identity Typography -->
  <text x="60" y="118" class="title">ERFAN DEHGHANI</text>

  <!-- Subtitle / Positioning -->
  <text x="60" y="162" class="subtitle">Software &amp; AI Developer  •  Co-Architect, Famwareta Ecosystem  •  Creative Technologist</text>

  <!-- Subtle Cyber Accents / Corner Coordinates -->
  <text x="1140" y="48" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484F58">LAT: 35.6892° N // 0x7E8</text>
  <text x="1140" y="196" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484F58">FAMWARETA.IR // DEV_CORE</text>

  <!-- Bottom Glowing Edge Wave -->
  <path d="M 2 232 Q 300 226, 600 232 T 1198 232" stroke="url(#neon-glow)" stroke-width="3" fill="none" opacity="0.9" />
</svg>
